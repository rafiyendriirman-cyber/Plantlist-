<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0a0d0b">
<title>Plantlist</title>
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0d0b;--text:#f2f5ef;--muted:#9ba797;--accent:#a8c66c;--ink:#122008;--glass:rgba(255,255,255,.075);--glass2:rgba(255,255,255,.14);--blur:24px;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);--spring:cubic-bezier(.34,1.5,.5,1);--ease:cubic-bezier(.2,.9,.25,1)}
body.flat{--glass:#161b17;--glass2:#1f251f;--blur:0px}
body.flat .glass{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;box-shadow:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
::-webkit-scrollbar{display:none}
#ambient{position:fixed;inset:0;z-index:0;background:radial-gradient(60% 40% at 12% 8%,rgba(168,198,108,.24),transparent 70%),radial-gradient(50% 40% at 92% 28%,rgba(255,170,80,.17),transparent 70%),radial-gradient(70% 50% at 50% 100%,rgba(70,110,80,.3),transparent 70%),var(--bg)}
#root{position:fixed;inset:0;max-width:560px;margin:0 auto;z-index:1;overflow:hidden;overflow:clip;contain:paint}
.scr{position:absolute;inset:0}
.glass{background:var(--glass);backdrop-filter:blur(var(--blur)) saturate(1.7) brightness(1.05);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.7) brightness(1.05);border:1px solid rgba(255,255,255,.13);box-shadow:inset 0 1px 0 rgba(255,255,255,.24),inset 0 -1px 0 rgba(255,255,255,.04),0 10px 30px rgba(0,0,0,.32)}
.muted{color:var(--muted)}
/* intro */
#intro{background:var(--bg);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .7s}
#intro svg{width:min(72vw,300px);height:auto;overflow:visible}
#intro .wm{font-size:34px;font-weight:800;letter-spacing:.5px;margin-top:6px;opacity:0;animation:fadeup 1s 3.9s forwards}
#intro .skip{position:absolute;bottom:calc(var(--safe-b) + 28px);font-size:12px;color:var(--muted);opacity:0;animation:fadeup 1s 4.6s forwards}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes soilin{from{opacity:0;transform:translateY(14px) scaleX(.6)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes leafin{from{transform:scale(0) rotate(-14deg);opacity:0}to{transform:none;opacity:1}}
@keyframes sunr{from{transform:translateY(80px) scale(.82);opacity:0}to{transform:none;opacity:1}}
.soil.an{opacity:0;transform-origin:200px 335px;animation:soilin 1.1s .3s ease-out forwards}
.stem.an{stroke-dasharray:200;stroke-dashoffset:200;animation:draw 1.5s 1.2s cubic-bezier(.3,.7,.3,1) forwards}
.lf.an{opacity:0;animation:leafin .9s cubic-bezier(.3,1.4,.5,1) forwards}
.sunw.an{opacity:0;transform-origin:200px 150px;animation:sunr 1.9s 2.8s cubic-bezier(.2,.8,.2,1) forwards}
/* login */
#login{z-index:60;display:none;flex-direction:column;justify-content:center;padding:calc(var(--safe-t) + 12px) 16px calc(var(--safe-b) + 12px);gap:clamp(6px,1.2dvh,12px);height:100dvh}
.lbrand{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;font-size:clamp(18px,2.8dvh,24px)}
.lbrand svg{width:clamp(34px,5.4dvh,48px);height:auto}
.lcard{border-radius:28px;padding:clamp(14px,2.4dvh,22px) 18px;display:flex;flex-direction:column;gap:clamp(7px,1.3dvh,12px)}
.lcard .lg{align-self:center;width:clamp(54px,9dvh,84px)}
.lcard .lg svg{width:100%;height:auto}
.lcard h1{font-size:clamp(24px,4.2dvh,36px);line-height:1.08;margin:0;text-align:center;font-weight:800}
.lcard label{font-size:13px;font-weight:700}
input.fld{height:clamp(40px,5.8dvh,48px);border-radius:14px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.2);padding:0 14px;width:100%;outline:none;transition:border-color .2s}
input.fld:focus{border-color:var(--accent)}
.btn{height:clamp(40px,5.9dvh,50px);border-radius:999px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;transition:transform .3s var(--spring),opacity .2s;font-size:15px}
.btn:active{transform:scale(.95)}
.btn.pri{background:var(--accent);color:var(--ink)}
.btn.ghost{border:1px solid rgba(255,255,255,.26);background:rgba(255,255,255,.05)}
.btn .gl{font-weight:800;font-size:19px;background:conic-gradient(from -45deg,#ea4335 0 25%,#fbbc05 0 50%,#34a853 0 75%,#4285f4 0);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn .fbk{width:20px;height:20px;border-radius:50%;background:#1877f2;color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center}
.or{text-align:center;color:var(--muted);font-size:13px}
.lfoot{text-align:center;font-size:14px;color:var(--muted)}
.lfoot b{color:var(--text);cursor:pointer}
.lnote{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--muted);font-size:11.5px;text-align:center;line-height:1.3}
.err{color:#ff9b8f;font-size:13px;text-align:center;min-height:0}
.back{align-self:flex-start;font-size:22px;padding:2px 6px 2px 0}
/* app */
#app{display:none;z-index:10}
.tab{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;padding:calc(var(--safe-t) + 58px) 18px 220px;display:none}
.tab.on{display:block;animation:tabin .4s var(--ease)}
@keyframes tabin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.h1{font-size:34px;font-weight:800;margin:0 0 14px;letter-spacing:-.5px}
.h2{font-size:21px;font-weight:800;margin:22px 0 12px}
.hhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.hbrand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.hbrand svg{width:44px;height:auto}
.sky{position:relative;width:88px;height:88px;flex:none}
.sky .ring{position:absolute;inset:6px;border-radius:50%;border:1px dashed rgba(255,255,255,.2)}
.sky .core{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.sky .core svg{width:34px;height:auto;opacity:.9}
#skyBody{position:absolute;left:50%;top:50%;width:24px;height:24px;margin:-12px;transition:transform 1.2s linear;display:flex;align-items:center;justify-content:center}
.sun{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff1a8,#ffb347 70%);box-shadow:0 0 16px 4px rgba(255,179,71,.6)}
.greet{font-size:34px;font-weight:800;letter-spacing:-.6px;margin:2px 0 14px}
.qg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qc{display:flex;align-items:center;gap:10px;border-radius:16px;overflow:hidden;height:58px;text-align:left;transition:transform .3s var(--spring)}
.qc:active{transform:scale(.96)}
.qc .cv{width:58px;height:58px;flex:none;border-radius:0}
.qc span{font-weight:700;font-size:13.5px;line-height:1.15;padding-right:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.streak{display:flex;align-items:center;gap:14px;border-radius:22px;padding:14px 18px;margin-top:12px}
.streak .fl{font-size:44px;filter:drop-shadow(0 0 14px rgba(255,140,40,.6));display:flex}
.streak b{font-size:26px}
.chips{display:flex;gap:10px;overflow-x:auto;padding:14px 0 2px}
.chip{flex:none;padding:9px 16px;border-radius:999px;background:var(--glass);border:1px solid rgba(255,255,255,.1);font-size:14px;font-weight:600;transition:all .25s var(--spring)}
.chip:active{transform:scale(.92)}
.chip.on{background:var(--accent);color:var(--ink);border-color:transparent}
.hs{touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch;display:flex;gap:14px;overflow-x:auto;margin:0 -18px;padding:0 18px 4px}
.hc{flex:none;width:150px;text-align:left}
.hc.big{width:170px}
.hc .cv{width:100%;aspect-ratio:1;border-radius:20px;margin-bottom:8px}
.hc .t{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv{background-size:cover;background-position:center;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;color:rgba(255,255,255,.88);font-size:22px;flex:none;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:8px 0;width:100%;text-align:left}
.row .cv{width:54px;height:54px;border-radius:10px}
.row .meta{flex:1;min-width:0}
.row .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:5px;align-items:center}
.row .s .i{color:var(--accent)}
.ib{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none;transition:transform .3s var(--spring),background .2s}
.ib:active{transform:scale(.86);background:rgba(255,255,255,.1)}
.sbar{display:flex;align-items:center;gap:10px;height:50px;border-radius:999px;padding:0 16px}
.sbar input{flex:1;background:none;border:0;outline:none;min-width:0;font-size:16px}
.seg{display:flex;gap:6px;padding:4px;border-radius:999px;margin:12px 0}
.seg button{flex:1;height:38px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted);transition:all .35s var(--spring)}
.seg button.on{background:rgba(255,255,255,.18);color:var(--text);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.ltabs{display:flex;gap:22px;overflow-x:auto;margin-bottom:12px}
.ltabs button{font-size:18px;color:var(--muted);padding-bottom:6px;border-bottom:3px solid transparent;white-space:nowrap}
.ltabs button.on{color:var(--text);border-color:var(--text);font-weight:700}
.tools{display:flex;align-items:center;justify-content:space-between;margin:12px 0}
.sortb{display:flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:600}
.empty{display:flex;flex-direction:column;align-items:center;gap:14px;padding:70px 20px;text-align:center;font-size:20px;font-weight:800}
.empty svg{width:90px;height:auto;opacity:.9}
.fab{position:absolute;right:20px;bottom:calc(178px + var(--safe-b));width:56px;height:56px;border-radius:50%;font-size:26px;display:none;align-items:center;justify-content:center;z-index:32;transition:transform .35s var(--spring)}
.fab:active{transform:scale(.88)}
.card{border-radius:22px;padding:6px 18px}
.card.pad{padding:16px 18px}
.coll{display:grid;grid-template-columns:1fr 1fr;width:100px;height:100px;border-radius:14px;overflow:hidden;flex:none}
.coll .cv{border-radius:0;width:100%;height:100%;font-size:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.gi{text-align:left}
.gi .cv,.gi .coll{width:100%;aspect-ratio:1;height:auto;border-radius:16px;margin-bottom:6px}
.gi .t{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gi .s{font-size:12.5px;color:var(--muted)}
.erow{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.07);width:100%;text-align:left;font-weight:600;font-size:16px}
.erow:last-child{border:0}
.erow .i{font-size:23px}
.erow .arr{margin-left:auto;color:var(--muted);font-size:18px}
.acc{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 14px}
.accb{border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.accb b{color:var(--text);font-size:17px}
.accb .btn{margin-top:8px;background:#f2f4f0;color:#111;height:42px}
/* nav */
#nav{position:absolute;left:14px;right:14px;bottom:calc(14px + var(--safe-b));height:72px;border-radius:999px;display:flex;padding:6px;z-index:31;transition:transform .45s var(--spring);touch-action:none}
#nav.press{transform:scale(.93)}
.nbtn{flex:1;position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);transition:color .3s;pointer-events:none}
.nbtn .i{font-size:25px;transition:transform .45s var(--spring)}
.nbtn.on{color:var(--text)}
.nbtn.on .i{transform:scale(1.12)}
#nind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/4);border-radius:999px;background:rgba(255,255,255,.17);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 0 14px rgba(255,255,255,.1),0 5px 16px rgba(0,0,0,.3);transition:transform .6s var(--spring),scale .35s var(--spring),background .3s;z-index:1;backdrop-filter:blur(10px) brightness(1.25);-webkit-backdrop-filter:blur(10px) brightness(1.25)}
#nav.press #nind{scale:.8;background:rgba(255,255,255,.28)}
/* mini */
#mini{position:absolute;left:12px;right:12px;bottom:calc(96px + var(--safe-b));height:64px;border-radius:999px;display:none;align-items:center;gap:12px;padding:0 10px;z-index:45;overflow:hidden;transition:transform .4s var(--spring),bottom .4s var(--ease)}
#mini:active{transform:scale(.97)}
#mini.low{bottom:calc(14px + var(--safe-b))}
#mini .prog{position:absolute;left:22px;right:22px;top:0;height:2px;background:rgba(255,255,255,.14);border-radius:2px;overflow:hidden}
#mini .prog i{display:block;height:100%;width:0;background:#fff}
#mini .cv{width:46px;height:46px;border-radius:50%;font-size:16px}
#mini.spin .cv{animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#mini .meta{flex:1;min-width:0}
#mini .t{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .s{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .pp{width:50px;height:50px;border-radius:50%;background:#f4f6f1;color:#0a0d0b;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none;transition:transform .3s var(--spring)}
#mini .pp:active{transform:scale(.86)}
/* pages */
#pages{position:absolute;inset:0;pointer-events:none;z-index:40}
.page{position:absolute;inset:0;isolation:isolate;pointer-events:auto;background:#0a0d0b;transform:translateX(100%);transition:transform .5s var(--ease);overflow-y:auto;padding:calc(var(--safe-t) + 52px) 18px 150px}
.page.in{transform:none}
.page.out{transform:translateX(100%)}
.phead{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:800;margin-bottom:14px;position:sticky;top:0;z-index:3;padding:6px 0}
.phead .ib{margin-left:-8px}
.phead .sp{flex:1}
.set{display:flex;align-items:center;gap:14px;padding:14px 2px;border-bottom:1px solid rgba(255,255,255,.07);width:100%;text-align:left}
.set .i{font-size:23px;color:var(--text)}
.set .tx{flex:1;font-weight:700;font-size:16px}
.set small{display:block;color:var(--muted);font-weight:400;font-size:13px;margin-top:2px;line-height:1.35}
.set .val{color:var(--muted);font-size:15px}
.tg{width:54px;height:32px;border-radius:999px;background:rgba(255,255,255,.18);position:relative;transition:background .3s;flex:none;border:1px solid rgba(255,255,255,.14)}
.tg::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .45s var(--spring)}
.tg.on{background:var(--accent)}
.tg.on::after{transform:translateX(22px)}
.sec{color:var(--muted);font-size:14px;margin:22px 4px 8px;font-weight:600}
/* profile */
.hero{position:relative;margin:calc(-52px - var(--safe-t)) -18px 0;padding:calc(var(--safe-t) + 70px) 18px 20px;text-align:center;overflow:hidden}
.hero .hb{position:absolute;inset:0;background-size:cover;background-position:center;filter:grayscale(.2) brightness(.6);transform:scale(1.15)}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(10,13,11,.2),rgba(10,13,11,1))}
.hero>*{position:relative;z-index:1}
.hero .back2{position:absolute;left:12px;top:calc(var(--safe-t) + 12px);z-index:5}
.avatar{width:124px;height:124px;border-radius:50%;margin:0 auto 14px;position:relative;box-shadow:0 0 0 4px rgba(255,255,255,.18),0 12px 30px rgba(0,0,0,.5)}
.avatar .cv{width:100%;height:100%;border-radius:50%;font-size:46px}
.avatar .cam{position:absolute;right:-2px;bottom:-2px;width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:20px}
.pname{font-size:28px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px}
.vb{width:26px;height:26px;flex:none}
.prole{color:var(--muted);margin-top:2px}
.pact{display:flex;justify-content:space-around;margin:18px 0 14px}
.pact button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600;min-width:64px}
.pact .i{font-size:26px}
.info{padding:6px 18px}
.info div.r{padding:14px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.info div.r:last-child{border:0}
.info b{display:block;font-size:17px}
.info span{color:var(--muted);font-size:14px}
.verif{display:flex;align-items:center;gap:12px}
/* full player */
#full{overflow-y:auto!important;overscroll-behavior:contain;touch-action:pan-y;position:absolute;inset:0;z-index:50;transform:translateY(102%);transition:transform .6s var(--ease);display:flex;flex-direction:column;padding:calc(var(--safe-t) + 14px) 24px calc(var(--safe-b) + 16px);background:#0a0d0b;overflow:hidden}
#full.open{transform:none}
.fbg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(60px) saturate(1.5) brightness(.55);transform:scale(1.3);transition:background-image .6s}
#full::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(10,13,11,.1),rgba(10,13,11,.75));pointer-events:none}
#full>*{position:relative;z-index:1}
.ftop{display:flex;align-items:center;justify-content:space-between}
.ftitle{font-weight:700;font-size:17px}
.fseg{align-self:center;display:flex;padding:4px;border-radius:999px;margin:8px 0 12px}
.fseg button{padding:8px 22px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted);transition:all .35s var(--spring)}
.fseg button.on{background:rgba(255,255,255,.2);color:#fff}
.fcover{width:min(100%,46dvh);aspect-ratio:1;align-self:center;border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.55);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:60px;font-weight:800;color:rgba(255,255,255,.8);transition:transform .6s var(--spring);flex:none}
#full.paused .fcover{transform:scale(.9)}
.finfo{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}
.finfo>div{min-width:0}
.ft{font-size:25px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fa{color:rgba(255,255,255,.7);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flyr{min-height:44px;margin:10px 0 4px;font-weight:800;font-size:19px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;transition:opacity .3s}
.flyr.na{color:rgba(255,255,255,.4);font-weight:600;font-size:15px}
#lyrFull{flex:1;overflow-y:auto;display:none;padding:10px 0 40px;mask-image:linear-gradient(transparent,#000 8%,#000 92%,transparent);-webkit-mask-image:linear-gradient(transparent,#000 8%,#000 92%,transparent)}
#full.lyron #lyrFull{display:block}
#full.lyron .fcover,#full.lyron .flyr,#full.lyron .fseg{display:none}
#lyrFull p{font-size:26px;font-weight:800;line-height:1.25;margin:0 0 18px;color:rgba(255,255,255,.4);transition:all .4s var(--ease);transform-origin:left}
#lyrFull p.on{color:#fff;transform:scale(1.03)}

const PIPED = ['https://pipedapi.kavin.rocks', 'https://api.piped.private.coffee', 'https://pipedapi.adminforge.de'];
async function fetchJ(u, ms = 7000) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), ms);

}
const ytId = s => { const m = String(s).match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/)([\w-]{11})/); return m ? m[1] : null; };
const decodeHtml = s => { const t = document.createElement('textarea'); t.innerHTML = s; return t.value; };
function cleanT(s) {
  return String(s).replace(/[\(\[][^\)\]]*(official|video|audio|lyric|lirik|mv|visualizer|clip|live)[^\)\]]*[\)\]]/ig, '').replace(/\s{2,}/g, ' ').trim();
}
function mkTrack(id, title, artist, dur, cover) {
  title = cleanT(decodeHtml(title || '')); artist = decodeHtml(artist || '').replace(/ - Topic$/i, '').replace(/VEVO$/i, '').trim();
  const p = title.split(' - ');
  if (p.length >= 2) { artist = p[0].trim(); title = p.slice(1).join(' - ').trim(); }
  const t = { id: 'y:' + id, vid: id, title: title || 'Tanpa judul', artist: artist || 'YouTube', dur: dur || 0, cover: cover || `https://i.ytimg.com/vi/${id}/mqdefault.jpg` };
  TR[t.id] = Object.assign(TR[t.id] || {}, t);
  return TR[t.id];
}
async function searchYT(q) {
  const id = ytId(q);
  if (id) {
    let title = 'Video YouTube', artist = '';
    try { 
      const j = await fetchJ('https://www.youtube.com/oembed?format=json&url=' + enc('https://www.youtube.com/watch?v=' + id)); 
      title = j.title; 
      artist = j.author_name; 
    } catch (e) {}
    return [mkTrack(id, title, artist, 0)];
  }

  // Jika menggunakan backend server kustom
  if (CONFIG.backendUrl) {
    try {
      const res = await fetch(`${CONFIG.backendUrl}/api/search?q=${enc(q)}`);
      const data = await res.json();
      if (Array.isArray(data)) {
        return data.map(item => mkTrack(item.vid, item.title, item.artist, item.dur, item.cover));
      }
    } catch (e) {
      console.warn('Gagal terhubung ke backend, beralih ke fallback Piped.');
    }
  }

  // Fallback ke Piped API seperti bawaan Plantlist
  try {
    return await Promise.any(PIPED.map(async b => {
      const j = await fetchJ(`${b}/search?q=${enc(q)}&filter=music_songs`, 5000);
      const it = (j.items || []).filter(x => x.url && ytId(x.url));
      if (!it.length) throw new Error('kosong');
      return it.map(x => mkTrack(ytId(x.url), x.title, x.uploaderName, x.duration, x.thumbnail));
    }));
  } catch (e) { 
    throw new Error('pencarian gagal'); 
  }
}

/* ---------------- YouTube Music (akun Google) ---------------- */
const GY = {
  tok: null, exp: 0, ld: null,
  on() { return !!LS.get('pl_gy', 0); },
  info() { return LS.get('pl_gy', 0); },
  load() { return this.ld || (this.ld = new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.onload = res; s.onerror = () => rej(new Error('Gagal memuat Google')); document.head.appendChild(s); })); },
  async token(interactive) {
    if (this.tok && Date.now() < this.exp - 30000) return this.tok;
    await this.load();
    return new Promise((res, rej) => {
      const c = google.accounts.oauth2.initTokenClient({
        client_id: cfgv('googleClientId'), scope: 'https://www.googleapis.com/auth/youtube.readonly',
        callback: r => { if (r.error) rej(new Error(r.error)); else { this.tok = r.access_token; this.exp = Date.now() + (r.expires_in || 3600) * 1000; res(this.tok); } },
        error_callback: e => rej(new Error(e && e.type || 'dibatalkan'))

      c.requestAccessToken({ prompt: interactive ? 'consent' : '' });
    });
  },
  async g(path, tok) { return gj('https://www.googleapis.com/youtube/v3/' + path, { Authorization: 'Bearer ' + tok }); }
};
async function syncYT(interactive) {
  const tok = await GY.token(interactive); toast('Mengambil playlist YouTube…');
  const ch = await GY.g('channels?part=snippet,contentDetails&mine=true', tok), c0 = (ch.items || [])[0];
  if (!c0) throw new Error('Akun Google ini belum punya saluran YouTube');
  const lists = [{ id: c0.contentDetails.relatedPlaylists.likes, name: 'YouTube • Disukai' }].filter(x => x.id);
  const pl = await GY.g('playlists?part=snippet&mine=true&maxResults=25', tok);
  (pl.items || []).forEach(p => lists.push({ id: p.id, name: p.snippet.title }));
  let n = 0;
  for (const L of lists.slice(0, 15)) {
    try {
      const it = await GY.g('playlistItems?part=snippet&maxResults=50&playlistId=' + enc(L.id), tok);
      const ts = (it.items || []).filter(i => i.snippet && i.snippet.resourceId && i.snippet.resourceId.videoId && !/^(Private|Deleted) video$/i.test(i.snippet.title)).map(i => { const th = i.snippet.thumbnails || {}; return mkTrack(i.snippet.resourceId.videoId, i.snippet.title, i.snippet.videoOwnerChannelTitle, 0, (th.medium || th.default || {}).url); });
      if (ts.length) { upsertPl('yt-' + L.id, L.name, ts, 'yt'); n += ts.length; }
    } catch (e) {}
  }
  LS.set('pl_gy', { name: c0.snippet.title }); save(); refresh();
  toast(n ? n + ' lagu dari YouTube masuk ke Pustaka' : 'Tidak ada lagu yang bisa diambil');
}
async function syncSP() {

  const lk = await SP.api('/me/tracks?limit=50'), lt = ((lk && lk.items) || []).map(i => i.track).filter(Boolean).map(x => SP.mk(x));
  if (lt.length) { upsertPl('sp-liked', 'Spotify • Disukai', lt, 'sp'); n += lt.length; }

      if (u) { if (!U || U.uid !== u.uid) { U = u; await loadData(); } } else { U = null; D = null; }

    });
  } catch (e) { authReady = true; U = null; D = null; if (introDone) route(); }

@keyframes hGrow{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes hPop{0%{transform:scale(0)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes hFade{from{opacity:0}to{opacity:1}}
@keyframes hUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes hRise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes hDrop{0%{transform:translateY(-320px);opacity:1}50%{transform:translateY(0)}65%{transform:translateY(-46px)}80%{transform:translateY(0)}90%{transform:translateY(-12px)}100%{transform:translateY(0)}}
@keyframes hEm{from{opacity:0;transform:translateY(var(--dy)) scale(.3)}to{opacity:1;transform:none}}
@keyframes hSway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes hHang{from{opacity:0;transform:translateY(-120px)}to{opacity:1;transform:none}}
@keyframes hTw{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes hGlow{0%,100%{opacity:.3}50%{opacity:.8}}
.hx.tree{transform-box:fill-box;transform-origin:50% 100%;animation:hGrow 1.1s ease-in both}
.hx.pop{transform-box:fill-box;transform-origin:50% 50%}
.hx.sway{transform-box:fill-box;transform-origin:50% 0}
.hx.tw{animation:hFade .6s both,hTw 2.4s 1s infinite}

  renderTab = function (n) {

    if (n === 'you') { const el = document.getElementById('tab-you'); if (el) el.insertAdjacentHTML('beforeend', `<div class="card glass" style="margin:14px 16px"><div class="row" data-act="openPA"><div class="meta"><div class="t">${isRamadan(new Date()) ? 'Alarm waktu sholat' : 'Kalender Hijriah'}</div><div class="s">${isRamadan(new Date()) ? 'Subuh, Dzuhur, Ashar, Maghrib, Isya (GPS)' : 'Koreksi hari Hijriah'}</div></div></div></div>`); }
  };

  /* ---------- menu lagu lengkap ---------- */
  const SS = { Normal: 1, 'Sped up': 1.25, Slowed: .85, 'Nightcore 1.4x': 1.4, 'Lo-fi': .93 };
  function setRate(r, name) {
    try { E.audio.preservesPitch = false; E.audio.mozPreservesPitch = false; E.audio.webkitPreservesPitch = false; E.audio.playbackRate = r; } catch (e) {}
    try { if (E.yt && E.ready) E.yt.setPlaybackRate(Math.max(.25, Math.min(2, r))); } catch (e) {}
    P._rate = r; P._style = name || 'Kustom'; toast('Gaya suara: ' + P._style);
  }
  A.fxStyle = () => { if (P.cur && P.cur.sp) return toast('Efek suara tidak tersedia untuk lagu Spotify'); openSheet(Object.keys(SS).map(k => ({ ic: 'chart', label: k + (P._style === k ? ' ✓' : ''), act: 'fxSet', arg: k })).concat([{ ic: 'chart', label: '8D dan Konser: belum tersedia di versi web', act: 'noop' }]), 'Gaya suara'); };
  A.fxSet = el => setRate(SS[el.dataset.arg], el.dataset.arg);
  A.noop = () => {};
  A.fxAdv = () => { if (P.cur && P.cur.sp) return toast('Efek suara tidak tersedia untuk lagu Spotify'); const r = P._rate || 1; openSheet([{ ic: 'plus', label: 'Tempo lebih cepat (+5%)', act: 'fxTempo', arg: .05 }, { ic: 'back', label: 'Tempo lebih lambat (-5%)', act: 'fxTempo', arg: -.05 }, { ic: 'chart', label: 'Reset', act: 'fxSet', arg: 'Normal' }], 'Tempo ' + Math.round(r * 100) + '%'); };
  A.fxTempo = el => setRate(Math.max(.5, Math.min(2, Math.round(((P._rate || 1) + +el.dataset.arg) * 100) / 100)));
  const searchFor = q => { try { SQ.q = q; setTab('search'); const i = document.getElementById('sIn'); if (i) i.value = q; runSearch(); } catch (e) {} };
  A.mnRadio = () => { const t = P.cur; if (t) { closeFullIf(); searchFor(t.artist); } };
  A.mnArtist = A.mnRadio;
  A.mnAlbum = () => { const t = P.cur; if (t) { closeFullIf(); searchFor((t.album || t.title) + ' ' + t.artist); } };
  const closeFullIf = () => { try { if (A.closeFull) A.closeFull(); } catch (e) {} };
  A.mnCopy = async () => { const t = P.cur; if (!t) return; const link = t.link || (t.vid ? 'https://youtu.be/' + t.vid : '') || (t.title + ' - ' + t.artist); try { await navigator.clipboard.writeText(link); toast('Link disalin'); } catch (e) { toast(link); } };
  A.mnPin = () => { const t = P.cur; if (!t) return; D.pins = D.pins || []; if (!D.pins.includes(t.id)) { D.pins.unshift(t.id); D.pins = D.pins.slice(0, 8); saveTrack(t); save(); } toast('Disematkan ke speed dial'); };
  A.mnRemove = async () => { const t = P.cur; if (!t) return; D.liked = D.liked.filter(x => x !== t.id); D.playlists.forEach(p => { p.items = p.items.filter(x => x !== t.id); }); save(); refresh(); toast('Dihapus dari pustaka'); };
  A.mnInfo = () => { const t = P.cur; if (!t) return; const m = document.getElementById('modal'); m.innerHTML = `<div class="box glass"><h3>${esc(t.title)}</h3><div class="muted">Artis: ${esc(t.artist || '-')}<br>Album: ${esc(t.album || '-')}<br>Durasi: ${t.dur ? fmt(t.dur) : '-'}<br>Sumber: ${t.sp ? 'Spotify' : t.vid ? 'YouTube' : t.local ? 'Perangkat' : 'Pratinjau'}</div><div class="acts"><button class="btn pri" id="mOk">Tutup</button></div></div>`; m.classList.add('on'); document.getElementById('mOk').onclick = () => m.classList.remove('on'); };
  A.mnAmbient = () => { const t = P.cur; if (!t) return; closeFullIf(); const o = mk('pl-amb', `<div class="bg" style="background-image:url('${(t.cover || '').replace(/'/g, '%27')}')"></div><img src="${esc(t.cover || '')}" alt=""><div><b style="font-size:22px">${esc(t.title)}</b><br><span style="opacity:.75">${esc(t.artist)}</span></div><div style="opacity:.5;font-size:12px">Ketuk untuk menutup</div>`); o.onclick = () => o.remove(); };
  A.mnTogether = () => { const t = P.cur; if (!t) return; const link = t.link || (t.vid ? 'https://youtu.be/' + t.vid : ''), txt = 'Dengarkan bareng aku di Plantlist: ' + t.title + ' - ' + t.artist + (link ? '\n' + link : ''); if (navigator.share) navigator.share({ text: txt }).catch(() => {}); else navigator.clipboard.writeText(txt).then(() => toast('Ajakan disalin'), () => toast(txt)); };
  A.mnDl = () => toast(P.cur && P.cur.sp ? 'Unduhan Spotify dikelola aplikasi Spotify' : 'Plantlist tidak menyimpan lagu ke penyimpanan HP');
  A.mnCard = async () => {
    const t = P.cur; if (!t) return; const W = 1080, H = 1350, cv = document.createElement('canvas'); cv.width = W; cv.height = H; const c = cv.getContext('2d');
    const g = c.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#123524'); g.addColorStop(.5, '#1f6b45'); g.addColorStop(1, '#0b1f15'); c.fillStyle = g; c.fillRect(0, 0, W, H);
    const draw = img => {
      if (img) { c.save(); c.beginPath(); c.roundRect(120, 120, 840, 840, 48); c.clip(); c.drawImage(img, 120, 120, 840, 840); c.restore(); }
      c.fillStyle = '#fff'; c.textAlign = 'center'; c.font = '800 60px sans-serif'; c.fillText((t.title || '').slice(0, 30), W / 2, 1060);
      c.fillStyle = 'rgba(255,255,255,.75)'; c.font = '600 40px sans-serif'; c.fillText((t.artist || '').slice(0, 40), W / 2, 1120);
      c.fillStyle = '#7ce08a'; c.font = '700 40px sans-serif'; c.fillText('Plantlist', W / 2, 1230);
      cv.toBlob(async b => {
        if (!b) return toast('Gagal membuat kartu (gambar sampul diblokir)');
        const f = new File([b], 'kartu-lagu.png', { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [f] })) { try { await navigator.share({ files: [f], text: t.title + ' - ' + t.artist }); } catch (e) {} }
        else { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'kartu-lagu.png'; a.click(); toast('Kartu disimpan'); }
      }, 'image/png');
    };
    if (!t.cover) return draw(null);
    const im = new Image(); im.crossOrigin = 'anonymous'; im.onload = () => draw(im); im.onerror = () => draw(null); im.src = t.cover;
  };
  A.curMenu = () => {
    const t = P.cur; if (!t) return; const lk = D.liked.includes(t.id);
    openSheet([
      { ic: lk ? 'heartf' : 'heart', label: lk ? 'Hapus dari Disukai' : 'Suka', act: 'likeCur' },
      { ic: 'chart', label: 'Mulai radio', act: 'mnRadio' },
      { ic: 'list', label: 'Tambah ke playlist', act: 'addPl', id: t.id },
      { ic: 'share', label: 'Salin link', act: 'mnCopy' },
      { ic: 'img', label: 'Bagikan kartu lagu', act: 'mnCard' },
      { ic: 'share', label: 'Bagikan', act: 'shareCur' },
      { ic: 'users', label: 'Dengar bersama (kirim ajakan)', act: 'mnTogether' },
      { ic: 'list', label: 'Rincian', act: 'mnInfo' },
      { ic: 'play', label: 'Mode ambient', act: 'mnAmbient' },
      { ic: 'chart', label: 'Gaya suara' + (P._style ? ': ' + P._style : ''), act: 'fxStyle' },
      { ic: 'chart', label: 'Lanjutan (tempo)', act: 'fxAdv' },
      { ic: 'users', label: 'Lihat artis', act: 'mnArtist' },
      { ic: 'list', label: 'Lihat album', act: 'mnAlbum' },
      { ic: 'plus', label: 'Sematkan ke speed dial', act: 'mnPin' },
      { ic: 'list', label: 'Unduhan', act: 'mnDl' },
      { ic: 'trash', label: 'Hapus dari pustaka', act: 'mnRemove', danger: true }
    ].concat(t.vid ? [{ ic: 'play', label: 'Buka di YouTube', act: 'openYT', id: t.vid }] : [], extraMenu(t)), t.title);
  };
})();

</script></body></html>
